<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">What Mobile Field Service does</title>
  <desc id="d">Three modes of the same phone app: company assets, customer service, and sales.</desc>
  <rect width="960" height="440" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0f172a">One phone app. Three kinds of field work.</text>
  <text x="480" y="68" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Works offline. Syncs when the radio comes back. Same database, different today board.</text>

  <!-- Assets -->
  <g transform="translate(28,96)">
    <rect width="284" height="312" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <rect width="284" height="8" rx="4" fill="#0d9488"/>
    <circle cx="142" cy="64" r="28" fill="#ccfbf1"/>
    <path d="M128 64h12l6-10 6 20 6-10h12" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="112" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Assets</text>
    <text x="142" y="136" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Facilities / plant tech</text>
    <text x="28" y="172" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#334155">Inspect, repair, and move</text>
    <text x="28" y="192" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#334155">company equipment.</text>
    <text x="28" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Work orders + assets map</text>
    <text x="28" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Photos, parts, checklists</text>
  </g>

  <!-- Customer -->
  <g transform="translate(338,96)">
    <rect width="284" height="312" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <rect width="284" height="8" rx="4" fill="#2563eb"/>
    <circle cx="142" cy="64" r="28" fill="#dbeafe"/>
    <circle cx="132" cy="60" r="8" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <circle cx="154" cy="60" r="8" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <path d="M118 80c4-8 12-12 24-12s20 4 24 12" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="142" y="112" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Customer</text>
    <text x="142" y="136" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">On-site service tech</text>
    <text x="28" y="172" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#334155">Deliver or service a job,</text>
    <text x="28" y="192" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#334155">then take a new order —</text>
    <text x="28" y="212" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#334155">even a new customer.</text>
    <text x="28" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Work orders + orders</text>
    <text x="28" y="264" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Catalog prices</text>
    <text x="28" y="284" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">No credit card payment yet</text>
  </g>

  <!-- Sales -->
  <g transform="translate(648,96)">
    <rect width="284" height="312" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <rect width="284" height="8" rx="4" fill="#d97706"/>
    <circle cx="142" cy="64" r="28" fill="#fef3c7"/>
    <rect x="128" y="52" width="28" height="22" rx="3" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <path d="M132 52v-4h20v4" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <text x="142" y="112" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Sales</text>
    <text x="142" y="136" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Route sales</text>
    <text x="28" y="172" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#334155">Quote, deliver, next stop.</text>
    <text x="28" y="192" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#334155">Work orders are optional.</text>
    <text x="28" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Orders + products + customers</text>
    <text x="28" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Rates and taxes snapshotted</text>
  </g>
</svg>
